<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сумма прописью (мгновенно)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 680px;
        }
        h2 {
            margin-top: 0;
            font-size: 20px;
            color: #1a202c;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }
        .input-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            font-size: 18px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #2563eb;
        }
        .result-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            font-size: 16px;
            line-height: 1.5;
            min-height: 54px;
            margin-bottom: 16px;
            word-wrap: break-word;
            color: #0f172a;
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .btn-outline {
            background-color: #ffffff;
            color: #334155;
            border: 2px solid #cbd5e1;
        }
        .btn-outline:hover {
            background-color: #f1f5f9;
            border-color: #94a3b8;
        }
        .btn-secondary {
            background-color: #475569;
        }
        .btn-secondary:hover {
            background-color: #334155;
        }
        .btn.copied {
            background-color: #16a34a !important;
            color: white !important;
            border-color: #16a34a !important;
        }
        .hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Перевод суммы в текст</h2>
    
    <div class="input-group">
        <label for="amountInput">Введите или вставьте сумму (пробелы удалятся, запятая заменится на точку):</label>
        <div class="input-row">
            <input type="text" id="amountInput" value="1682300.63" placeholder="Например: 1 682 300,63" autofocus>
            <button class="btn btn-outline" id="copyNumBtn" type="button" title="Скопировать очищенное число">Копировать число</button>
            <button class="btn" id="genBtn" type="button">Сгенерировать</button>
        </div>
    </div>

    <label>Результат прописью:</label>
    <div class="result-box" id="resultText"></div>

    <button class="btn btn-secondary" id="copyBtn" type="button">Скопировать текст</button>
    <div class="hint">При вставке «1 682 300,63» поле автоматически превратит его в «1682300.63».</div>
</div>

<script>
    const input = document.getElementById('amountInput');
    const resultBox = document.getElementById('resultText');
    const copyBtn = document.getElementById('copyBtn');
    const copyNumBtn = document.getElementById('copyNumBtn');
    const genBtn = document.getElementById('genBtn');

    function normalizeInputString(raw) {
        let cleaned = raw.replace(/[\s\u00A0]+/g, '').replace(/,/g, '.');
        cleaned = cleaned.replace(/[^0-9.]/g, '');
        let parts = cleaned.split('.');
        if (parts.length > 2) {
            cleaned = parts.at(0) + '.' + parts.slice(1).join('');
        }
        return cleaned;
    }

    function declension(number, one, few, many) {
        const n = Math.abs(number) % 100;
        const n1 = n % 10;
        if (n > 10 && n < 20) return many;
        if (n1 > 1 && n1 < 5) return few;
        if (n1 === 1) return one;
        return many;
    }

    function numberToWords(num) {
        if (num === 0) return 'ноль';

        const ones = new Array('', 'один', 'два', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять');
        const onesFem = new Array('', 'одна', 'две', 'три', 'четыре', 'пять', 'шесть', 'семь', 'восемь', 'девять');
        const teens = new Array('десять', 'одиннадцать', 'двенадцать', 'тринадцать', 'четырнадцать', 'пятнадцать', 'шестнадцать', 'семнадцать', 'восемнадцать', 'девятнадцать');
        const tens = new Array('', '', 'двадцать', 'тридцать', 'сорок', 'пятьдесят', 'шестьдесят', 'семьдесят', 'восемьдесят', 'девяносто');
        const hundreds = new Array('', 'сто', 'двести', 'триста', 'четыреста', 'пятьсот', 'шестьсот', 'семьсот', 'восемьсот', 'девятьсот');

        const orders = new Array(
            { one: '', few: '', many: '', fem: false },
            { one: 'тысяча', few: 'тысячи', many: 'тысяч', fem: true },
            { one: 'миллион', few: 'миллиона', many: 'миллионов', fem: false },
            { one: 'миллиард', few: 'миллиарда', many: 'миллиардов', fem: false },
            { one: 'триллион', few: 'триллиона', many: 'триллионов', fem: false }
        );

        let str = Math.floor(num).toString();
        let groups = new Array();
        while (str.length > 0) {
            groups.push(parseInt(str.slice(-3), 10));
            str = str.slice(0, -3);
        }

        let words = new Array();

        for (let i = groups.length - 1; i >= 0; i--) {
            let n = groups.at(i);
            if (n === 0) continue;

            let order = orders.at(i) || { one: '', few: '', many: '', fem: false };
            let h = Math.floor(n / 100);
            let t = Math.floor((n % 100) / 10);
            let o = n % 10;

            if (h > 0) words.push(hundreds.at(h));

            if (t === 1) {
                words.push(teens.at(o));
            } else {
                if (t > 1) words.push(tens.at(t));
                if (o > 0) {
                    words.push(order.fem ? onesFem.at(o) : ones.at(o));
                }
            }

            if (i > 0) {
                words.push(declension(n, order.one, order.few, order.many));
            }
        }

        return words.join(' ');
    }

    function formatCurrency(cleaned) {
        if (!cleaned || cleaned === '.') {
            return '';
        }

        let parts = cleaned.split('.');
        let rubStr = parts.at(0) || '0';
        let kopStr = parts.length > 1 ? parts.at(1) : '00';

        if (kopStr.length === 0) {
            kopStr = '00';
        } else if (kopStr.length === 1) {
            kopStr = kopStr + '0';
        } else if (kopStr.length > 2) {
            let fullNum = parseFloat(rubStr + '.' + kopStr);
            let rounded = fullNum.toFixed(2).split('.');
            rubStr = rounded.at(0);
            kopStr = rounded.at(1);
        }

        let rubNum = parseInt(rubStr, 10);
        let kopNum = parseInt(kopStr, 10);

        if (isNaN(rubNum)) rubNum = 0;
        if (isNaN(kopNum)) kopNum = 0;

        let formattedRub = rubNum.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

        let words = numberToWords(rubNum);
        words = words.charAt(0).toUpperCase() + words.slice(1);

        let rubWord = declension(rubNum, 'рубль', 'рубля', 'рублей');
        let kopWord = declension(kopNum, 'копейка', 'копейки', 'копеек');

        return `${formattedRub} (${words}) ${rubWord} ${kopStr} ${kopWord}`;
    }

    function update() {
        const normalized = normalizeInputString(input.value);
        if (input.value !== normalized) {
            input.value = normalized;
        }
        const res = formatCurrency(normalized);
        resultBox.textContent = res || 'Введите корректное число...';
    }

    function copyTextToClipboard(text, buttonElement) {
        if (!text || text === 'Введите корректное число...') return;

        navigator.clipboard.writeText(text).then(() => {
            const originalText = buttonElement.textContent;
            buttonElement.textContent = 'Скопировано!';
            buttonElement.classList.add('copied');
            setTimeout(() => {
                buttonElement.textContent = originalText;
                buttonElement.classList.remove('copied');
            }, 1500);
        });
    }

    genBtn.addEventListener('click', update);
    copyBtn.addEventListener('click', () => copyTextToClipboard(resultBox.textContent, copyBtn));
    copyNumBtn.addEventListener('click', () => copyTextToClipboard(input.value, copyNumBtn));
    
    input.addEventListener('input', update);
    input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            update();
        }
    });
    
    update();
    input.select();
</script>

</body>
</html>
